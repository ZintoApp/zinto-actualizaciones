
services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bothive-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: bothive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BotHive Application (Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bothive-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=9000
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/bothive
      - PGSSLMODE=disable
      - SESSION_SECRET=bothive-docker-secret
      - FORCE_INSECURE_COOKIE=true
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=12345678
      - BASE_URL=${BASE_URL:-http://localhost:9000}
      - DOCKER_CONTAINER=true
    ports:
      - "9000:9000"
    volumes:
      - ./uploads:/app/uploads
      - ./whatsapp-sessions:/app/whatsapp-sessions
      - ./data:/app/data
      - ./migrations:/app/migrations
      # Auto-update volumes
      - bothive_updates:/app/volumes/updates
      - bothive_backups:/app/volumes/backups
      - bothive_app_updates:/app/volumes/app-updates
      - bothive_restart_signals:/app/volumes
    dns:
      - 8.8.8.8
      - 1.1.1.1
    sysctls:
      net.ipv4.tcp_keepalive_time: 60
    deploy:
      resources:
        reservations:
          cpus: "1.0"
          memory: 512m
    restart: unless-stopped

volumes:
  postgres_data:
  # Auto-update persistent volumes
  bothive_updates:
  bothive_backups:
  bothive_app_updates:
  bothive_restart_signals:
